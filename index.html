<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ගාථා - Gatha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #28241d;
      --soft-ink: #716957;
      --gold: #baa56f;
      --cream: #fffdf8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 320px;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: "Noto Sans Sinhala", "Iskoola Pota", sans-serif;
      background:
        radial-gradient(ellipse 34% 42% at 4% 86%, rgba(221, 194, 137, .44) 0%, rgba(239, 225, 194, .22) 48%, transparent 78%),
        linear-gradient(135deg, #fdfbf6 0%, #faf6ec 58%, #f6ecd3 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 56vw;
      height: 115vh;
      right: -20vw;
      top: -23vh;
      background: #eddaa9;
      border-radius: 50% 0 0 58%;
      transform: rotate(-12deg);
      opacity: .82;
      box-shadow: -8vw 12vh 0 rgba(239, 214, 166, .38);
    }

    body::after {
      width: 49vw;
      height: 76vh;
      left: -28vw;
      bottom: -49vh;
      border: 4.8vh solid rgba(214, 187, 126, .54);
      border-radius: 50%;
      opacity: .7;
    }

    header, main, footer { position: relative; z-index: 2; }

    header {
      height: 62px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 20.5%;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      display: flex;
      gap: 18px;
      white-space: nowrap;
      font-size: 11px;
    }

    nav a, .footer-links a { color: #403d35; text-decoration: none; }
    nav a:hover, .footer-links a:hover { color: #8c7338; }

    .brand {
      font-family: "Noto Sans Sinhala", sans-serif;
      font-size: 16px;
      font-weight: 500;
      white-space: nowrap;
    }

    .search-box { display: flex; justify-self: end; }

    .search-field { position: relative; width: 198px; }

    .search-field input {
      width: 100%;
      height: 29px;
      border: 1px solid rgba(171, 151, 105, .23);
      border-radius: 20px;
      background: rgba(255, 255, 255, .92);
      padding: 0 38px 0 14px;
      outline: none;
      color: var(--ink);
      font: 11px Arial, Helvetica, sans-serif;
    }

    .search-field input::placeholder { color: #aaa394; }

    .search-field svg {
      position: absolute;
      right: 12px;
      top: 8px;
      width: 13px;
      height: 13px;
      fill: none;
      stroke: #aaa394;
      stroke-width: 1.7;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 38px 24px 54px;
    }

    .card-wrapper {
      position: relative;
      width: min(66.5%, 780px);
      margin-top: 48px;
    }

    .bo-emblem {
      position: absolute;
      width: 112px;
      height: 132px;
      left: 50%;
      top: -98px;
      transform: translateX(-50%);
      transform-origin: 50% 100%;
      z-index: 4;
      overflow: visible;
      filter:
        drop-shadow(0 5px 5px rgba(139, 113, 62, .16))
        drop-shadow(0 1px 1px rgba(255, 255, 255, .8));
      animation: leafBreathe 5.5s ease-in-out infinite;
    }

    .leaf-body {
      transform-origin: 60px 102px;
      animation: leafSway 5.5s ease-in-out infinite;
    }

    .leaf-highlight {
      mix-blend-mode: screen;
      opacity: .28;
    }

    @keyframes leafSway {
      0%, 100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(1.4deg); }
    }

    @keyframes leafBreathe {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.018); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bo-emblem, .leaf-body { animation: none; }
    }

    .card {
      min-height: 252px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 52px 36px 35px;
      border: 1.5px solid #bda970;
      border-radius: 10px;
      background: rgba(255, 253, 248, .94);
      box-shadow:
        0 3px 0 rgba(166, 143, 88, .72),
        0 14px 26px rgba(104, 82, 42, .12);
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(24px, 2.15vw, 30px);
      line-height: 1.35;
      font-weight: 600;
    }

    .verse p {
      margin: 0;
      font-size: clamp(17px, 1.42vw, 21px);
      line-height: 1.72;
      font-weight: 400;
    }

    .powered {
      margin: 42px 0 0;
      color: #77715f;
      font: 7.5px Arial, Helvetica, sans-serif;
    }

    .powered a { color: #77715f; text-decoration: underline; }

    footer {
      min-height: 50px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 12px 20.5% 0;
      color: #605e56;
      font: 9.5px Arial, Helvetica, sans-serif;
    }

    .footer-links { display: flex; gap: 23px; }

    @media (max-width: 900px) {
      header {
        padding: 0 24px;
        grid-template-columns: 1fr auto;
      }
      .brand { justify-self: end; }
      .search-box { display: none; }
      footer { padding: 12px 24px 0; }
      .card-wrapper { width: min(82%, 780px); }
    }

    @media (max-width: 560px) {
      header { height: 58px; }
      nav { gap: 10px; }
      nav a { font-size: 10px; }
      .brand { font-size: 13px; }
      main { justify-content: flex-start; padding-top: 105px; }
      .bo-emblem { width: 96px; height: 114px; top: -84px; }
      .card-wrapper { width: 92%; margin-top: 42px; }
      .card { min-height: 270px; padding: 48px 14px 32px; }
      h1 { font-size: 21px; }
      .verse p { font-size: 14.5px; line-height: 1.9; }
      footer { font-size: 8px; }
      .footer-links { gap: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="bodhi-wandana.html">Gathas</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="brand">ගාථා - Gatha</div>

    <div class="search-box">
      <div class="search-field">
        <input type="search" placeholder="Search" aria-label="Search" />
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" />
          <line x1="16" y1="16" x2="21" y2="21" />
        </svg>
      </div>
    </div>
  </header>

  <main>
    <div class="card-wrapper">
      <svg class="bo-emblem" viewBox="0 0 120 140" aria-hidden="true">
        <defs>
          <radialGradient id="leafFace" cx="38%" cy="26%" r="78%">
            <stop offset="0%" stop-color="#fffef7" />
            <stop offset="28%" stop-color="#f7f1dc" />
            <stop offset="72%" stop-color="#dde0b7" />
            <stop offset="100%" stop-color="#bcc98b" />
          </radialGradient>
          <linearGradient id="leafEdge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#cfce9c" />
            <stop offset="50%" stop-color="#9eac70" />
            <stop offset="100%" stop-color="#777d4c" />
          </linearGradient>
          <linearGradient id="leafVein" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d6cb9c" />
            <stop offset="50%" stop-color="#9e955f" />
            <stop offset="100%" stop-color="#7f7a50" />
          </linearGradient>
          <filter id="soften"><feGaussianBlur stdDeviation=".18" /></filter>
        </defs>

        <g class="leaf-body">
          <!-- Lively, asymmetric Bo leaf outline with a pronounced drip tip. -->
          <path d="M60 5
                   C57.8 13.5 60.2 22.2 64.5 29.5
                   C68.8 36.8 74.8 40.8 80.8 46.2
                   C86.5 51.3 91.4 56.8 94.2 63.5
                   C96.7 69.4 96.4 74.8 92.6 78.5
                   C96.5 82.2 98.8 87.2 98.1 92
                   C97.6 96.2 94.8 99.1 91.4 99.4
                   C91.1 106.2 86.7 112.2 80.2 115.1
                   C73.4 118.1 66.2 114.7 60 107.8
                   C53.8 114.7 46.6 118.1 39.8 115.1
                   C33.3 112.2 28.9 106.2 28.6 99.4
                   C25.2 99.1 22.4 96.2 21.9 92
                   C21.2 87.2 23.5 82.2 27.4 78.5
                   C23.6 74.8 23.3 69.4 25.8 63.5
                   C28.6 56.8 33.5 51.3 39.2 46.2
                   C45.2 40.8 51.2 36.8 55.5 29.5
                   C59.8 22.2 62.2 13.5 60 5 Z"
                fill="url(#leafFace)" stroke="url(#leafEdge)" stroke-width="1.45"
                stroke-linejoin="round" />

          <!-- Subtle leaf-light sweep. -->
          <path class="leaf-highlight"
                d="M60 8 C53 28 41 43 32 58 C27 66 26 75 29 81 C37 69 47 59 60 48 C67 38 69 24 60 8 Z"
                fill="#ffffff" />

          <!-- Central vein and irregular natural branch veins. -->
          <g fill="none" stroke="url(#leafVein)" stroke-linecap="round">
            <path d="M60 10 C60.7 34 59.4 68 60 106" stroke-width="1.55" />
            <path d="M60 43 C51.8 44.7 44.7 50.3 38.3 57.4" stroke-width="1.08" />
            <path d="M60 43 C68.2 44.7 75.3 50.3 81.7 57.4" stroke-width="1.08" />
            <path d="M60 57 C48.8 59.4 39.7 66.8 32.4 76.2" stroke-width="1.05" />
            <path d="M60 57 C71.2 59.4 80.3 66.8 87.6 76.2" stroke-width="1.05" />
            <path d="M60 72 C48.2 76.2 39.2 84.8 32.7 93.9" stroke-width="1.02" />
            <path d="M60 72 C71.8 76.2 80.8 84.8 87.3 93.9" stroke-width="1.02" />
            <path d="M60 87 C51 91 44.8 98.1 40.5 105.8" stroke-width=".92" />
            <path d="M60 87 C69 91 75.2 98.1 79.5 105.8" stroke-width=".92" />
          </g>

          <!-- Fine edge waves make the perimeter feel organic rather than geometric. -->
          <g fill="none" stroke="#929b64" stroke-width=".48" opacity=".58" filter="url(#soften)">
            <path d="M27 64 Q29 59 33 56 M24 75 Q27 73 29 70 M23 88 Q26 85 29 83 M31 108 Q35 111 39 112" />
            <path d="M93 64 Q91 59 87 56 M96 75 Q93 73 91 70 M97 88 Q94 85 91 83 M89 108 Q85 111 81 112" />
          </g>

          <!-- Dharma chakra remains the visual anchor. -->
          <g transform="translate(60 101)">
            <circle r="18" fill="#f1e2b3" stroke="#a78b48" stroke-width="1.15" />
            <circle r="13.8" fill="#fffaf0" stroke="#b59a57" stroke-width="1.05" />
            <g stroke="#a78b48" stroke-width="1.65" stroke-linecap="round">
              <line x1="0" y1="-13.5" x2="0" y2="13.5" />
              <line x1="-13.5" y1="0" x2="13.5" y2="0" />
              <line x1="-9.55" y1="-9.55" x2="9.55" y2="9.55" />
              <line x1="9.55" y1="-9.55" x2="-9.55" y2="9.55" />
            </g>
            <circle r="5" fill="#d8be7d" stroke="#a78b48" stroke-width="1.05" />
            <circle r="1.8" fill="#fffaf0" />
            <g fill="#b99c56">
              <circle cx="0" cy="-18" r="1.3" /><circle cx="0" cy="18" r="1.3" />
              <circle cx="-18" cy="0" r="1.3" /><circle cx="18" cy="0" r="1.3" />
              <circle cx="-12.7" cy="-12.7" r="1.3" /><circle cx="12.7" cy="12.7" r="1.3" />
              <circle cx="12.7" cy="-12.7" r="1.3" /><circle cx="-12.7" cy="12.7" r="1.3" />
            </g>
          </g>
        </g>
      </svg>

      <article class="card">
        <h1>නිර්වාණ බෝධි වන්දනා</h1>
        <div class="verse">
          <p>නාග ලොවේ සිට වැඩමෙව් සමිදේ</p>
          <p>අමත පරායණ බිමෙ රැස් විහිදේ</p>
          <p>දළු සුදු පැහැයෙන් බබළන සමිදේ</p>
          <p>අපිත් වදිමු නිර්වාණ බෝ සමිදේ</p>
        </div>
      </article>
    </div>

    <p class="powered">Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></p>
  </main>

  <footer>
    <div>© Copyright GitHub Pages</div>
    <div class="footer-links">
      <a href="index.html">Copyright</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>
</body>
</html>
