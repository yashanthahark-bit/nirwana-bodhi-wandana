<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> නිර්වාණ බෝධි වන්දනා </title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-cream: #f6efe0;
      --bg-warm: #eadcb9;
      --card-bg: #fbf7ec;
      --gold-border: #d8be86;
      --text-dark: #26221b;
      --text-muted: #6e634f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans Sinhala", "Iskoola Pota", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text-dark);
      background:
        radial-gradient(circle at 88% 18%, rgba(226, 198, 134, 0.45) 0%, transparent 42%),
        radial-gradient(circle at 15% 88%, rgba(218, 188, 122, 0.35) 0%, transparent 45%),
        linear-gradient(135deg, var(--bg-cream) 0%, var(--bg-warm) 100%);
    }

    /* Top Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 36px;
      background: rgba(251, 247, 236, 0.72);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(216, 190, 134, 0.45);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.9rem;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
    }

    nav a:hover {
      color: var(--text-dark);
    }

    .brand {
      font-family: "Noto Sans Sinhala", sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-dark);
    }

    .search-box input {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--gold-border);
      background: #ffffff;
      font-size: 0.85rem;
      color: var(--text-dark);
      outline: none;
      width: 190px;
    }

    /* Main Centered Card Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .emblem {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--gold-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: -24px;
      z-index: 2;
      box-shadow: 0 4px 12px rgba(90, 68, 26, 0.08);
    }

    .emblem svg {
      width: 28px;
      height: 28px;
      fill: #c9a65b;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1.5px solid var(--gold-border);
      border-radius: 14px;
      padding: 52px 36px 44px;
      text-align: center;
      box-shadow: 0 14px 34px rgba(84, 63, 24, 0.08);
    }

    h1 {
      font-size: clamp(1.45rem, 2.8vw, 2rem);
      font-weight: 700;
      margin-bottom: 26px;
      color: #1f1b14;
    }

    .verse p {
      font-size: clamp(1.05rem, 1.9vw, 1.3rem);
      line-height: 2;
      color: #2b261e;
    }

    .powered {
      margin-top: 22px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .powered a {
      color: var(--text-muted);
      text-decoration: underline;
    }

    /* Footer */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 36px;
      background: rgba(251, 247, 236, 0.72);
      border-top: 1px solid rgba(216, 190, 134, 0.45);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.82rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-links {
      display: flex;
      gap: 18px;
    }

    .footer-links a {
      text-decoration: none;
      color: var(--text-muted);
    }

    .footer-links a:hover {
      color: var(--text-dark);
    }

    @media (max-width: 640px) {
      header,
      footer {
        padding: 12px 18px;
      }
      .search-box {
        display: none;
      }
      .card {
        padding: 44px 20px 36px;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Primary Navigation">
      <a href="index.html">Home</a>
      <a href="bodhi-wandana.html">Gathas</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="brand">ගාථා</div>
    <div class="search-box">
      <input type="search" placeholder="Search" aria-label="Search" />
    </div>
  </header>

  <main>
    <div class="emblem" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8.5 6.8 6 10.4 6 13.5a6 6 0 0 0 12 0c0-3.1-2.5-6.7-6-11.5zm0 15.5a3.5 3.5 0 0 1-3.5-3.5c0-1.9 1.4-4.4 3.5-7.4 2.1 3 3.5 5.5 3.5 7.4a3.5 3.5 0 0 1-3.5 3.5z" />
      </svg>
    </div>

    <article class="card">
      <h1>නිර්වාණ බෝධි වන්දනා ගාථාව</h1>
      <div class="verse">
        <p>නාග ලොවේ සිට වැඩමෙව් සමිදේ</p>
        <p>අමත පරායණ බිමෙ රැස් විහිදේ</p>
        <p>දළු සුදු පැහැයෙන් බබළන සමිදේ</p>
        <p>අපිත් වදිමු නිර්වාණ බෝ සමිදේ</p>
      </div>
      <p class="powered">
        Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>
      </p>
    </article>
  </main>

  <footer>
    <div>© Copyright GitHub Pages</div>
    <div class="footer-links">
      <a href="index.html">Copyright</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>
</body>
</html>
