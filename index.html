<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ගාථා - Gatha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-base: #fbf7ee;
      --border-gold: #bfa05a;
      --border-gold-dark: #a68743;
      --text-primary: #221e17;
      --text-secondary: #5a5243;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans Sinhala", "Iskoola Pota", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-base);
      color: var(--text-primary);
      position: relative;
      overflow-x: hidden;
    }

    /* Seamless Background Curves matching Prototype */
    .bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Top Navigation Bar — Seamless over background */
    header {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 18px 48px;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.9rem;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      text-decoration: none;
      color: #2f2a21;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #8c6d2e;
    }

    .brand {
      font-family: "Noto Sans Sinhala", sans-serif;
      font-size: 1.08rem;
      font-weight: 500;
      color: #2b261d;
      letter-spacing: 0.01em;
    }

    .search-box {
      display: flex;
      justify-content: flex-end;
    }

    .search-field {
      position: relative;
      width: 220px;
    }

    .search-field input {
      width: 100%;
      padding: 7px 36px 7px 16px;
      border-radius: 999px;
      border: 1px solid rgba(191, 160, 90, 0.35);
      background: rgba(255, 255, 255, 0.95);
      font-size: 0.85rem;
      color: var(--text-primary);
      outline: none;
      box-shadow: 0 2px 6px rgba(90, 70, 30, 0.05);
    }

    .search-field input::placeholder {
      color: #9e9584;
    }

    .search-field svg {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      stroke: #9e9584;
      fill: none;
    }

    /* Main Stage */
    main {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 24px 44px;
    }

    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      margin-top: 42px;
    }

    /* Overlapping Bo Leaf & Detailed Dharma Chakra Emblem */
    .bo-emblem {
      position: absolute;
      top: -72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      pointer-events: none;
      filter: drop-shadow(0 3px 6px rgba(135, 108, 52, 0.14));
    }

    .card {
      width: 100%;
      background: linear-gradient(180deg, #fdfbf6 0%, #f9f3e4 100%);
      border: 2px solid var(--border-gold);
      border-radius: 16px;
      padding: 66px 48px 56px;
      text-align: center;
      position: relative;
      box-shadow:
        0 2px 0 var(--border-gold-dark),
        0 26px 56px rgba(74, 56, 20, 0.16),
        0 6px 16px rgba(74, 56, 20, 0.07),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    h1 {
      font-size: clamp(1.75rem, 3.4vw, 2.55rem);
      font-weight: 500;
      color: #1f1b14;
      margin-bottom: 30px;
      line-height: 1.35;
    }

    .verse p {
      font-size: clamp(1.2rem, 2.2vw, 1.56rem);
      font-weight: 400;
      line-height: 1.95;
      color: #262119;
    }

    .powered {
      margin-top: 22px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .powered a {
      color: var(--text-secondary);
      text-decoration: underline;
    }

    /* Footer — Seamless over background */
    footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 48px;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.82rem;
      color: var(--text-secondary);
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-links {
      display: flex;
      gap: 22px;
    }

    .footer-links a {
      text-decoration: none;
      color: var(--text-secondary);
    }

    .footer-links a:hover {
      color: var(--text-primary);
    }

    @media (max-width: 768px) {
      header {
        grid-template-columns: 1fr auto;
        padding: 14px 20px;
      }
      .search-box {
        display: none;
      }
      .card {
        padding: 58px 22px 44px;
      }
      footer {
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Prototype Sweeping Golden Curves -->
  <svg class="bg-canvas" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="baseCream" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fcf9f2" />
        <stop offset="58%" stop-color="#f7efe0" />
        <stop offset="100%" stop-color="#f0e0be" />
      </linearGradient>
      <linearGradient id="rightGoldArc" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#eddcb6" stop-opacity="0.78" />
        <stop offset="100%" stop-color="#e1c68c" stop-opacity="0.92" />
      </linearGradient>
      <radialGradient id="bottomLeftGlow" cx="22%" cy="88%" r="42%">
        <stop offset="0%" stop-color="#e5cd99" stop-opacity="0.68" />
        <stop offset="70%" stop-color="#efe0be" stop-opacity="0.28" />
        <stop offset="100%" stop-color="#fbf7ee" stop-opacity="0" />
      </radialGradient>
    </defs>

    <rect width="1440" height="900" fill="url(#baseCream)" />
    <rect width="1440" height="900" fill="url(#bottomLeftGlow)" />

    <path
      d="M935,0 C900,190 980,390 1165,530 C1275,612 1370,665 1440,695 L1440,0 Z"
      fill="url(#rightGoldArc)"
    />
    <path
      d="M1180,290 C1065,450 1095,710 1235,900 L1440,900 L1440,240 Z"
      fill="#e6cf9c"
      fill-opacity="0.48"
    />
  </svg>

  <header>
    <nav aria-label="Primary Navigation">
      <a href="index.html">Home</a>
      <a href="bodhi-wandana.html">Gathas</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="brand">ගාථා - Gatha</div>
    <div class="search-box">
      <div class="search-field">
        <input type="search" placeholder="Search" aria-label="Search" />
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="20" y1="20" x2="16.2" y2="16.2" />
        </svg>
      </div>
    </div>
  </header>

  <main>
    <div class="card-wrapper">
      <!-- Sacred Bo Leaf & Crisp 8-Spoked Dharma Chakra -->
      <div class="bo-emblem" aria-hidden="true">
        <svg width="102" height="120" viewBox="0 0 120 140">
          <defs>
            <linearGradient id="boLeafGrad" x1="20%" y1="0%" x2="85%" y2="100%">
              <stop offset="0%" stop-color="#f7eed9" />
              <stop offset="55%" stop-color="#ebe0c4" />
              <stop offset="100%" stop-color="#dfd0ad" />
            </linearGradient>
            <radialGradient id="chakraGold" cx="35%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#f5e3b3" />
              <stop offset="60%" stop-color="#dfc17d" />
              <stop offset="100%" stop-color="#c39f52" />
            </radialGradient>
          </defs>

          <!-- Heart-shaped Sacred Bo Leaf with Long Drip-Tip -->
          <path
            d="M60 6
               C61.5 20, 66 30, 77 41
               C93 57, 102 74, 96 93
               C91 108, 74 114, 60 105
               C46 114, 29 108, 24 93
               C18 74, 27 57, 43 41
               C54 30, 58.5 20, 60 6 Z"
            fill="url(#boLeafGrad)"
            stroke="#c7b07e"
            stroke-width="1.6"
            stroke-linejoin="round"
          />

          <!-- Delicate Leaf Midrib and Lateral Veins -->
          <g stroke="#c3ab79" stroke-width="1.25" stroke-linecap="round" fill="none" opacity="0.85">
            <path d="M60 14 L60 104" />
            <path d="M60 44 Q49 48 42 54" />
            <path d="M60 44 Q71 48 78 54" />
            <path d="M60 58 Q44 64 34 72" />
            <path d="M60 58 Q76 64 86 72" />
            <path d="M60 73 Q43 80 32 89" />
            <path d="M60 73 Q77 80 88 89" />
          </g>

          <!-- Rich Golden 8-Spoked Dharma Chakra (Wheel of Dhamma) -->
          <g transform="translate(60, 96)">
            <!-- Outer Finials / Knobs -->
            <g fill="#cfa958" stroke="#a68136" stroke-width="0.9">
              <circle cx="0" cy="-18.5" r="1.7" />
              <circle cx="0" cy="18.5" r="1.7" />
              <circle cx="-18.5" cy="0" r="1.7" />
              <circle cx="18.5" cy="0" r="1.7" />
              <circle cx="-13.1" cy="-13.1" r="1.7" />
              <circle cx="13.1" cy="13.1" r="1.7" />
              <circle cx="13.1" cy="-13.1" r="1.7" />
              <circle cx="-13.1" cy="13.1" r="1.7" />
            </g>

            <!-- Outer Rim -->
            <circle r="16.2" fill="url(#chakraGold)" stroke="#a68136" stroke-width="1.4" />
            <!-- Inner Cutout Circle -->
            <circle r="12.2" fill="#fbf5e6" stroke="#b08b3e" stroke-width="1.2" />

            <!-- 8 Spokes -->
            <g stroke="#a68136" stroke-width="1.6" stroke-linecap="round">
              <line x1="0" y1="-12.2" x2="0" y2="12.2" />
              <line x1="-12.2" y1="0" x2="12.2" y2="0" />
              <line x1="-8.6" y1="-8.6" x2="8.6" y2="8.6" />
              <line x1="8.6" y1="-8.6" x2="-8.6" y2="8.6" />
            </g>

            <!-- Central Hub -->
            <circle r="4.5" fill="url(#chakraGold)" stroke="#a68136" stroke-width="1.3" />
            <circle r="1.6" fill="#fbf5e6" />
          </g>
        </svg>
      </div>

      <article class="card">
        <h1>නිර්වාණ බෝධි වන්දනා</h1>
        <div class="verse">
          <p>නාග ලොවේ සිට වැඩමෙව් සමිදේ</p>
          <p>අමත පරායණ බිමෙ රැස් විහිදේ</p>
          <p>දළු සුදු පැහැයෙන් බබළන සමිදේ</p>
          <p>අපිත් වදිමු නිර්වාණ බෝ සමිදේ</p>
        </div>
      </article>
    </div>

    <p class="powered">
      Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>
    </p>
  </main>

  <footer>
    <div>© Copyright GitHub Pages</div>
    <div class="footer-links">
      <a href="index.html">Copyright</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>
</body>
</html>
