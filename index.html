<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ගාථා - Gatha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #28241d;
      --soft-ink: #716957;
      --gold: #baa56f;
      --cream: #fffdf8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 320px;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: "Noto Sans Sinhala", "Iskoola Pota", sans-serif;
      background:
        radial-gradient(ellipse 34% 42% at 4% 86%, rgba(221, 194, 137, .44) 0%, rgba(239, 225, 194, .22) 48%, transparent 78%),
        linear-gradient(135deg, #fdfbf6 0%, #faf6ec 58%, #f6ecd3 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 56vw;
      height: 115vh;
      right: -20vw;
      top: -23vh;
      background: #eddaa9;
      border-radius: 50% 0 0 58%;
      transform: rotate(-12deg);
      opacity: .82;
      box-shadow: -8vw 12vh 0 rgba(239, 214, 166, .38);
    }

    body::after {
      width: 49vw;
      height: 76vh;
      left: -28vw;
      bottom: -49vh;
      border: 4.8vh solid rgba(214, 187, 126, .54);
      border-radius: 50%;
      opacity: .7;
    }

    header, main, footer { position: relative; z-index: 2; }

    header {
      height: 62px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 20.5%;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      display: flex;
      gap: 18px;
      white-space: nowrap;
      font-size: 11px;
    }

    nav a, .footer-links a {
      color: #403d35;
      text-decoration: none;
    }

    nav a:hover, .footer-links a:hover { color: #8c7338; }

    .brand {
      font-family: "Noto Sans Sinhala", sans-serif;
      font-size: 16px;
      font-weight: 500;
      white-space: nowrap;
    }

    .search-box { display: flex; justify-self: end; }

    .search-field {
      position: relative;
      width: 198px;
    }

    .search-field input {
      width: 100%;
      height: 29px;
      border: 1px solid rgba(171, 151, 105, .23);
      border-radius: 20px;
      background: rgba(255, 255, 255, .92);
      padding: 0 38px 0 14px;
      outline: none;
      color: var(--ink);
      font: 11px Arial, Helvetica, sans-serif;
    }

    .search-field input::placeholder { color: #aaa394; }

    .search-field svg {
      position: absolute;
      right: 12px;
      top: 8px;
      width: 13px;
      height: 13px;
      fill: none;
      stroke: #aaa394;
      stroke-width: 1.7;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 38px 24px 54px;
    }

    .card-wrapper {
      position: relative;
      width: min(66.5%, 780px);
      margin-top: 48px;
    }

    .bo-emblem {
      position: absolute;
      width: 80px;
      height: 94px;
      left: 50%;
      top: -78px;
      transform: translateX(-50%);
      z-index: 4;
    }

    .card {
      min-height: 252px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 52px 36px 35px;
      border: 1.5px solid #bda970;
      border-radius: 10px;
      background: rgba(255, 253, 248, .94);
      box-shadow:
        0 3px 0 rgba(166, 143, 88, .72),
        0 14px 26px rgba(104, 82, 42, .12);
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(24px, 2.15vw, 30px);
      line-height: 1.35;
      font-weight: 600;
    }

    .verse p {
      margin: 0;
      font-size: clamp(17px, 1.42vw, 21px);
      line-height: 1.72;
      font-weight: 400;
    }

    .powered {
      margin: 42px 0 0;
      color: #77715f;
      font: 7.5px Arial, Helvetica, sans-serif;
    }

    .powered a {
      color: #77715f;
      text-decoration: underline;
    }

    footer {
      min-height: 50px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 12px 20.5% 0;
      color: #605e56;
      font: 9.5px Arial, Helvetica, sans-serif;
    }

    .footer-links {
      display: flex;
      gap: 23px;
    }

    @media (max-width: 900px) {
      header {
        padding: 0 24px;
        grid-template-columns: 1fr auto;
      }

      .brand { justify-self: end; }
      .search-box { display: none; }

      footer { padding: 12px 24px 0; }
      .card-wrapper { width: min(82%, 780px); }
    }

    @media (max-width: 560px) {
      header {
        height: 58px;
      }

      nav { gap: 10px; }
      nav a { font-size: 10px; }
      .brand { font-size: 13px; }

      main {
        justify-content: flex-start;
        padding-top: 105px;
      }

      .card-wrapper {
        width: 92%;
        margin-top: 42px;
      }

      .card {
        min-height: 270px;
        padding: 48px 14px 32px;
      }

      h1 { font-size: 21px; }
      .verse p { font-size: 14.5px; line-height: 1.9; }

      footer {
        font-size: 8px;
      }

      .footer-links { gap: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="bodhi-wandana.html">Gathas</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="brand">ගාථා - Gatha</div>

    <div class="search-box">
      <div class="search-field">
        <input type="search" placeholder="Search" aria-label="Search" />
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" />
          <line x1="16" y1="16" x2="21" y2="21" />
        </svg>
      </div>
    </div>
  </header>

  <main>
    <div class="card-wrapper">
      <svg class="bo-emblem" viewBox="0 0 120 140" aria-hidden="true">
        <defs>
          <linearGradient id="leaf" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#fffdf7" />
            <stop offset="100%" stop-color="#f1ead9" />
          </linearGradient>
        </defs>

        <path d="M60 7 C62 22 67 32 78 43 C94 59 101 76 96 94 C91 111 74 116 60 107 C46 116 29 111 24 94 C19 76 26 59 42 43 C53 32 58 22 60 7Z"
              fill="url(#leaf)" stroke="#cbbb91" stroke-width="1.6" />

        <g fill="none" stroke="#cbbb91" stroke-width="1.2" stroke-linecap="round">
          <path d="M60 14 L60 106" />
          <path d="M60 45 Q48 49 41 56" />
          <path d="M60 45 Q72 49 79 56" />
          <path d="M60 60 Q44 65 34 74" />
          <path d="M60 60 Q76 65 86 74" />
          <path d="M60 77 Q44 83 34 92" />
          <path d="M60 77 Q76 83 86 92" />
        </g>

        <g transform="translate(60 97)">
          <circle r="17" fill="#efdfb7" stroke="#aa9152" stroke-width="1.2" />
          <circle r="12.7" fill="#fffaf0" stroke="#b39a5e" stroke-width="1.2" />
          <g stroke="#aa9152" stroke-width="1.7" stroke-linecap="round">
            <line x1="0" y1="-12.5" x2="0" y2="12.5" />
            <line x1="-12.5" y1="0" x2="12.5" y2="0" />
            <line x1="-8.8" y1="-8.8" x2="8.8" y2="8.8" />
            <line x1="8.8" y1="-8.8" x2="-8.8" y2="8.8" />
          </g>
          <circle r="4.7" fill="#dabf79" stroke="#aa9152" stroke-width="1.2" />
          <circle r="1.7" fill="#fffaf0" />
        </g>
      </svg>

      <article class="card">
        <h1>නිර්වාණ බෝධි වන්දනා</h1>
        <div class="verse">
          <p>නාග ලොවේ සිට වැඩමෙව් සමිදේ</p>
          <p>අමත පරායණ බිමෙ රැස් විහිදේ</p>
          <p>දළු සුදු පැහැයෙන් බබළන සමිදේ</p>
          <p>අපිත් වදිමු නිර්වාණ බෝ සමිදේ</p>
        </div>
      </article>
    </div>

    <p class="powered">Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></p>
  </main>

  <footer>
    <div>© Copyright GitHub Pages</div>
    <div class="footer-links">
      <a href="index.html">Copyright</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>
</body>
</html>
