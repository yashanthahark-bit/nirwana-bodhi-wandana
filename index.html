<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ගාථා - Gatha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-base: #fbf7ee;
      --card-bg: #fcf9f2;
      --border-gold: #c7af76;
      --border-gold-soft: #e2d1a7;
      --text-primary: #221e17;
      --text-secondary: #5a5243;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans Sinhala", "Iskoola Pota", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-base);
      color: var(--text-primary);
      position: relative;
      overflow-x: hidden;
    }

    /* Exact Prototype Background Curves */
    .bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Top Navigation Bar */
    header {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 15px 48px;
      background: linear-gradient(
        90deg,
        rgba(252, 249, 242, 0.92) 0%,
        rgba(249, 242, 224, 0.88) 65%,
        rgba(242, 228, 194, 0.85) 100%
      );
      border-bottom: 1px solid rgba(199, 175, 118, 0.25);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.9rem;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      text-decoration: none;
      color: #2f2a21;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #8c6d2e;
    }

    .brand {
      font-family: "Noto Sans Sinhala", sans-serif;
      font-size: 1.08rem;
      font-weight: 500;
      color: #2b261d;
      letter-spacing: 0.01em;
    }

    .search-box {
      display: flex;
      justify-content: flex-end;
    }

    .search-field {
      position: relative;
      width: 220px;
    }

    .search-field input {
      width: 100%;
      padding: 7px 36px 7px 16px;
      border-radius: 999px;
      border: 1px solid #e3d6b8;
      background: #ffffff;
      font-size: 0.85rem;
      color: var(--text-primary);
      outline: none;
      box-shadow: 0 1px 3px rgba(90, 70, 30, 0.04);
    }

    .search-field input::placeholder {
      color: #9e9584;
    }

    .search-field svg {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      stroke: #9e9584;
      fill: none;
    }

    /* Main Stage */
    main {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 48px;
    }

    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      margin-top: 38px;
    }

    /* Overlapping Bo Leaf & Lotus Rosette Emblem */
    .bo-emblem {
      position: absolute;
      top: -68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      pointer-events: none;
      filter: drop-shadow(0 3px 6px rgba(135, 108, 52, 0.12));
    }

    .card {
      width: 100%;
      background: linear-gradient(180deg, #fdfbf6 0%, #faf5e8 100%);
      border: 1.5px solid var(--border-gold);
      border-radius: 16px;
      padding: 64px 48px 56px;
      text-align: center;
      position: relative;
      box-shadow:
        0 26px 55px rgba(74, 56, 20, 0.14),
        0 6px 16px rgba(74, 56, 20, 0.06);
    }

    /* Subtle inner bevel highlight */
    .card::after {
      content: "";
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(226, 209, 167, 0.55);
      border-radius: 13px;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(1.75rem, 3.4vw, 2.55rem);
      font-weight: 500;
      color: #1f1b14;
      margin-bottom: 30px;
      line-height: 1.35;
    }

    .verse p {
      font-size: clamp(1.2rem, 2.2vw, 1.56rem);
      font-weight: 400;
      line-height: 1.95;
      color: #262119;
    }

    .powered {
      margin-top: 22px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .powered a {
      color: var(--text-secondary);
      text-decoration: underline;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 48px;
      background: rgba(251, 247, 238, 0.82);
      border-top: 1px solid rgba(199, 175, 118, 0.25);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.82rem;
      color: var(--text-secondary);
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-links {
      display: flex;
      gap: 22px;
    }

    .footer-links a {
      text-decoration: none;
      color: var(--text-secondary);
    }

    .footer-links a:hover {
      color: var(--text-primary);
    }

    @media (max-width: 768px) {
      header {
        grid-template-columns: 1fr auto;
        padding: 14px 20px;
      }
      .search-box {
        display: none;
      }
      .card {
        padding: 56px 22px 44px;
      }
      footer {
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Prototype Sweeping Golden Curves -->
  <svg class="bg-canvas" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="baseCream" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fcf9f2" />
        <stop offset="60%" stop-color="#f7efe0" />
        <stop offset="100%" stop-color="#f1e2c2" />
      </linearGradient>
      <linearGradient id="rightGoldArc" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#eddcb6" stop-opacity="0.72" />
        <stop offset="100%" stop-color="#e3ca94" stop-opacity="0.88" />
      </linearGradient>
      <radialGradient id="bottomLeftGlow" cx="22%" cy="88%" r="42%">
        <stop offset="0%" stop-color="#e7d09e" stop-opacity="0.65" />
        <stop offset="70%" stop-color="#efe0be" stop-opacity="0.28" />
        <stop offset="100%" stop-color="#fbf7ee" stop-opacity="0" />
      </radialGradient>
    </defs>

    <!-- Base Warm Cream -->
    <rect width="1440" height="900" fill="url(#baseCream)" />

    <!-- Soft Circular Golden Wash on Bottom-Left -->
    <rect width="1440" height="900" fill="url(#bottomLeftGlow)" />

    <!-- Sweeping Right-Side Golden Organic Curve -->
    <path
      d="M935,0 C900,190 980,390 1165,530 C1275,612 1370,665 1440,695 L1440,0 Z"
      fill="url(#rightGoldArc)"
    />
    <path
      d="M1180,290 C1065,450 1095,710 1235,900 L1440,900 L1440,240 Z"
      fill="#e8d3a3"
      fill-opacity="0.45"
    />
  </svg>

  <header>
    <nav aria-label="Primary Navigation">
      <a href="index.html">Home</a>
      <a href="bodhi-wandana.html">Gathas</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="brand">ගාථා - Gatha</div>
    <div class="search-box">
      <div class="search-field">
        <input type="search" placeholder="Search" aria-label="Search" />
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="20" y1="20" x2="16.2" y2="16.2" />
        </svg>
      </div>
    </div>
  </header>

  <main>
    <div class="card-wrapper">
      <!-- Authentic Champagne-Gold Bo Leaf & Lotus Rosette matching Prototype -->
      <div class="bo-emblem" aria-hidden="true">
        <svg width="96" height="114" viewBox="0 0 120 140">
          <defs>
            <linearGradient id="boLeafGrad" x1="20%" y1="0%" x2="85%" y2="100%">
              <stop offset="0%" stop-color="#f7eed9" />
              <stop offset="55%" stop-color="#ece0c3" />
              <stop offset="100%" stop-color="#dfd0ad" />
            </linearGradient>
          </defs>

          <!-- Heart-shaped Sacred Bo Leaf with Graceful Drip-Tip -->
          <path
            d="M60 6
               C61.5 20, 66 30, 77 41
               C93 57, 102 74, 96 93
               C91 108, 74 114, 60 105
               C46 114, 29 108, 24 93
               C18 74, 27 57, 43 41
               C54 30, 58.5 20, 60 6 Z"
            fill="url(#boLeafGrad)"
            stroke="#cbb689"
            stroke-width="1.6"
            stroke-linejoin="round"
          />

          <!-- Delicate Leaf Midrib and Lateral Veins -->
          <g stroke="#c7b183" stroke-width="1.25" stroke-linecap="round" fill="none" opacity="0.85">
            <path d="M60 14 L60 104" />
            <path d="M60 44 Q49 48 42 54" />
            <path d="M60 44 Q71 48 78 54" />
            <path d="M60 58 Q44 64 34 72" />
            <path d="M60 58 Q76 64 86 72" />
            <path d="M60 73 Q43 80 32 89" />
            <path d="M60 73 Q77 80 88 89" />
          </g>

          <!-- Ornate 8-Petal Lotus / Dharma Medallion at Base -->
          <g transform="translate(60, 96)">
            <circle r="16.5" fill="#fbf6ea" stroke="#c8b07b" stroke-width="1.6" />
            <circle r="13.5" fill="none" stroke="#dcc89b" stroke-width="0.9" />
            <!-- 8 Lotus Petals -->
            <g fill="#ead9b3" stroke="#c2a76f" stroke-width="1.1">
              <ellipse cx="0" cy="-8.5" rx="2.7" ry="5" />
              <ellipse cx="0" cy="8.5" rx="2.7" ry="5" />
              <ellipse cx="-8.5" cy="0" rx="5" ry="2.7" />
              <ellipse cx="8.5" cy="0" rx="5" ry="2.7" />
              <ellipse cx="-6" cy="-6" rx="2.7" ry="5" transform="rotate(-45 -6 -6)" />
              <ellipse cx="6" cy="6" rx="2.7" ry="5" transform="rotate(-45 6 6)" />
              <ellipse cx="6" cy="-6" rx="2.7" ry="5" transform="rotate(45 6 -6)" />
              <ellipse cx="-6" cy="6" rx="2.7" ry="5" transform="rotate(45 -6 6)" />
            </g>
            <circle r="3.4" fill="#fbf6ea" stroke="#c2a76f" stroke-width="1.3" />
          </g>
        </svg>
      </div>

      <article class="card">
        <h1>නිර්වාණ බෝධි වන්දනා ගාථාව</h1>
        <div class="verse">
          <p>නාග ලොවේ සිට වැඩමෙව් සමිදේ</p>
          <p>අමත පරායණ බිමෙ රැස් විහිදේ</p>
          <p>දළු සුදු පැහැයෙන් බබළන සමිදේ</p>
          <p>අපිත් වදිමු නිර්වාණ බෝ සමිදේ</p>
        </div>
      </article>
    </div>

    <p class="powered">
      Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>
    </p>
  </main>

  <footer>
    <div>© Copyright GitHub Pages</div>
    <div class="footer-links">
      <a href="index.html">Copyright</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>
</body>
</html>
